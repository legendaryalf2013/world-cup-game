<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/scores-fixtures.js"></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body class="dark-bg scrollable">
  <h1 class="title">Dashboard</h1>

  <div id="playerName" class="info"></div>
  <div id="prizeMoney" class="info"></div>

  <div class="menu">
    <button class="btn" onclick="location.href='leaderboard.html'">Leaderboard</button>
    <button class="btn" onclick="location.href='my-teams.html'">My Teams</button>
    <button class="btn" onclick="location.href='scores-fixtures.html'">Scores & Fixtures</button>
    <button class="btn red" onclick="logout()">Log Out</button>
  </div>

  <div id="adminButton" style="display:none; text-align:center; margin-top:10px;">
    <button class="btn admin" onclick="openAdmin()">Admin Panel</button>
  </div>

  <h2 class="subtitle">Leaderboard (Top 3)</h2>
  <div id="topLeaderboard"></div>

  <h2 class="subtitle">Upcoming Games</h2>
  <div id="upcomingGames"></div>
</body>
</html>
