<!DOCTYPE html>
<html>
<head>
  <title>Scores & Fixtures</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase (for person filter) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/teams-api.js"></script>
  <script src="js/scores-fixtures.js" defer></script>
</head>
<body class="dark-bg scrollable">
  <h1 class="title">Scores & Fixtures</h1>

  <div class="menu">
    <button class="btn" onclick="loadAllMatches()">All</button>
    <button class="btn" onclick="loadLiveMatches()">Live</button>
    <button class="btn" onclick="loadKnockout()">Knockout</button>
    <button class="btn" onclick="loadUpcoming()">Upcoming</button>
  </div>

  <div class="card">
    <h3>Filters</h3>
    <p>By team:</p>
    <select id="teamFilter" class="input"></select>
    <p>By person:</p>
    <select id="personFilter" class="input"></select>
    <div class="menu" style="margin-top:10px;">
      <button class="btn" onclick="applyTeamFilter()">Filter by Team</button>
      <button class="btn" onclick="applyPersonFilter()">Filter by Person</button>
      <button class="btn red" onclick="clearFilters()">Clear Filters</button>
    </div>
  </div>

  <div id="matchesList"></div>

  <div style="text-align:center; margin-top:15px;">
    <button class="btn" onclick="location.href='dashboard.html'">Back</button>
  </div>
</body>
</html>
